<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>খেলাফত মজলিস - ব্যয় ভাউচার</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

  :root {
    --primary: #0d5c3a;       /* ডিপ ইসলামিক রয়্যাল গ্রিন */
    --primary-light: #e8f5e9; /* হালকা গ্রিন ব্যাকগ্রাউন্ড টিঙ্ক */
    --primary-dark: #073823;
    --accent: #d4a373;        /* মার্জিত গোল্ডেন বর্ডার অ্যাকসেন্ট */
    --text-main: #212529;
    --border-color: #0d5c3a;
  }

  * { box-sizing: border-box; }

  @page {
    size: A4;
    margin: 0;
  }

  body {
    font-family: 'Noto Sans Bengali', sans-serif;
    margin: 0;
    padding: 0;
    background: #e5e9ec;
    color: var(--text-main);
  }

  .page {
    width: 210mm;
    height: 297mm;
    margin: 10mm auto;
    background: #fff;
    padding: 6mm 8mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }

  .voucher {
    border: 2px solid var(--primary);
    outline: 1px solid var(--accent);
    outline-offset: -4px;
    border-radius: 4px;
    padding: 5mm 9mm;
    height: 138mm;
    flex: 0 0 138mm;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ffffff;
  }

  /* হেডার সেকশন */
  .header {
    text-align: center;
    margin-bottom: 2mm;
    padding-bottom: 2mm;
    border-bottom: 1.5px dashed #b7d5c7;
    background: linear-gradient(180deg, #f7fbf9 0%, #ffffff 100%);
    border-radius: 4px;
    padding-top: 1mm;
  }

  .header h1 {
    font-size: 19pt;
    line-height: 1.2;
    font-weight: 800;
    margin: 0;
    color: var(--primary);
    letter-spacing: 0.5px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.05);
  }

  .header .address {
    font-size: 9.5pt;
    line-height: 1.3;
    margin: 1mm 0 0 0;
    color: #495057;
    font-weight: 500;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2mm;
  }

  .voucher-no {
    font-size: 10.5pt;
    line-height: 1.3;
    font-weight: 700;
    color: var(--primary);
    text-align: right;
    display: flex;
    align-items: center;
    gap: 2mm;
  }

  .voucher-no input {
    width: 30mm;
    font-weight: 700;
    color: #b02a37;
  }

  /* ইনপুট ফিল্ড স্টাইল */
  input[type="text"] {
    border: none;
    border-bottom: 1.5px dotted #8ba89b;
    font-family: 'Noto Sans Bengali', sans-serif;
    font-size: 10.5pt;
    line-height: 1.3;
    background: transparent;
    padding: 0.8mm 1.5mm;
    outline: none;
    color: #111;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-bottom: 1.5px solid var(--primary);
    background: #fdfefe;
  }

  .field-row {
    display: flex;
    align-items: baseline;
    margin: 1.5mm 0;
    font-size: 10.5pt;
    line-height: 1.3;
  }

  .field-label {
    white-space: nowrap;
    margin-right: 2mm;
    font-weight: 700;
    color: var(--primary-dark);
  }

  .field-row input[type="text"] {
    flex: 1;
  }

  /* খরচ টেবিল */
  table.expense-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 2.5mm;
    font-size: 10pt;
    line-height: 1.3;
  }

  table.expense-table th,
  table.expense-table td {
    border: 1px solid #7ea694;
    padding: 1.5mm 2.5mm;
    vertical-align: middle;
  }

  table.expense-table th {
    text-align: center;
    font-weight: 700;
    background: linear-gradient(180deg, #0d5c3a 0%, #0a4b2f 100%);
    color: #ffffff;
    letter-spacing: 0.3px;
  }

  table.expense-table td.date-col { width: 18%; }
  table.expense-table td.desc-col { width: 60%; }
  table.expense-table td.amount-col { width: 22%; text-align: right; }

  .body-rows:nth-child(even) {
    background-color: #f7faf8;
  }

  .body-rows td { height: 7mm; }

  .body-rows input[type="text"] {
    width: 100%;
    height: 100%;
    line-height: 1.3;
    border: none;
    background: transparent;
  }

  .total-row {
    background-color: #eaf4ef;
  }

  .total-row td { 
    font-weight: 700; 
    border-top: 1.5px solid var(--primary);
  }

  .total-label { 
    text-align: right; 
    color: var(--primary-dark);
    font-size: 10.5pt;
  }

  .total-row input[type="text"] {
    width: 100%;
    border: none;
    font-weight: 800;
    color: #a71d2a;
    font-size: 11pt;
    text-align: right;
  }

  /* কথায় সেকশন */
  .kothay-row {
    display: flex;
    align-items: flex-start;
    margin-top: 2.5mm;
    font-size: 10pt;
    line-height: 1.35;
    background: #f9fbf9;
    padding: 1mm 2mm;
    border-radius: 3px;
    border-left: 3px solid var(--primary);
  }

  .kothay-value {
    flex: 1;
    border-bottom: 1px dotted #8ba89b;
    white-space: normal;
    word-break: break-word;
    padding: 0.8mm 1.5mm;
    min-height: 1.2em;
    font-weight: 600;
    color: var(--primary-dark);
  }

  /* স্বাক্ষর সেকশন */
  .signatures {
    display: flex;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 3mm;
    font-size: 10pt;
    line-height: 1.3;
  }

  .sign-box {
    text-align: center;
    width: 35%;
  }

  .sign-line {
    border-top: 1.2px dashed #0d5c3a;
    padding-top: 1.5mm;
    font-weight: 600;
    color: #333;
  }

  /* প্রিন্ট স্টাইল */
  @media print {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    html, body {
      width: 210mm;
      height: 297mm;
      background: #fff;
    }
    .page {
      margin: 0;
      width: 210mm;
      height: 297mm;
      padding: 6mm 8mm;
      box-shadow: none;
      page-break-after: avoid;
    }
    .voucher {
      page-break-inside: avoid;
    }
    .no-print { display: none; }
    input[type="text"] {
      border-bottom: 1.5px dotted #777 !important;
    }
    .body-rows input[type="text"],
    .total-row input[type="text"] {
      border: none !important;
    }
  }

  /* বাটন বার */
  .no-print {
    max-width: 210mm;
    margin: 10mm auto 4mm;
    text-align: center;
    font-family: 'Noto Sans Bengali', sans-serif;
  }
  .no-print button {
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin: 0 6px;
    border: none;
    border-radius: 5px;
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: all 0.2s ease;
  }
  .no-print button:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
  }
  .no-print button:last-child {
    background: #6c757d;
  }
  .no-print button:last-child:hover {
    background: #5a6268;
  }
</style>
</head>
<body>

<div class="no-print">
  <button onclick="window.print()">🖨️ প্রিন্ট করুন / Print</button>
  <button onclick="clearAll()">🔄 সব খালি করুন / Clear All</button>
</div>

<div class="page">
  <div id="voucher-container"></div>
</div>

<template id="voucher-template">
  <div class="voucher">
    <div class="header">
      <h1>মজলিস কমপ্লেক্স প্রকল্প</h1>
      <p class="address">ফায়েনাজ টাওয়ার, ফ্ল্যাট নং ১১/এ, ৩৭/২ পুরানা পল্টন (পল্টন কালভার্ট রোড), ঢাকা-১০০০</p>
    </div>

    <div class="top-row">
      <div class="field-row" style="margin:0;">
        <span class="field-label">তারিখ:</span>
        <input type="text" style="width:45mm;">
      </div>
      <div class="voucher-no">
        <span>ভাউচার নং:</span>
        <input type="text">
      </div>
    </div>

    <div class="field-row">
      <span class="field-label">ব্যয়কারীর নাম:</span>
      <input type="text">
    </div>

    <div class="field-row">
      <span class="field-label">ব্যয়ের খাত:</span>
      <input type="text">
    </div>

    <table class="expense-table">
      <thead>
        <tr>
          <th class="date-col">তারিখ</th>
          <th class="desc-col">বিবরণ</th>
          <th class="amount-col">টাকার পরিমাণ</th>
        </tr>
      </thead>
      <tbody>
        <tr class="body-rows">
          <td class="date-col"><input type="text"></td>
          <td class="desc-col"><input type="text"></td>
          <td class="amount-col"><input type="text"></td>
        </tr>
        <tr class="body-rows">
          <td class="date-col"><input type="text"></td>
          <td class="desc-col"><input type="text"></td>
          <td class="amount-col"><input type="text"></td>
        </tr>
        <tr class="body-rows">
          <td class="date-col"><input type="text"></td>
          <td class="desc-col"><input type="text"></td>
          <td class="amount-col"><input type="text"></td>
        </tr>
        <tr class="body-rows">
          <td class="date-col"><input type="text"></td>
          <td class="desc-col"><input type="text"></td>
          <td class="amount-col"><input type="text"></td>
        </tr>
        <tr class="body-rows">
          <td class="date-col"><input type="text"></td>
          <td class="desc-col"><input type="text"></td>
          <td class="amount-col"><input type="text"></td>
        </tr>
        <tr class="total-row">
          <td colspan="2" class="total-label">মোট:</td>
          <td class="amount-col"><input type="text" readonly></td>
        </tr>
      </tbody>
    </table>

    <div class="kothay-row">
      <span class="field-label">কথায়:</span>
      <div class="kothay-value"></div>
    </div>

    <div class="signatures">
      <div class="sign-box">
        <div class="sign-line">ব্যয়কারীর স্বাক্ষর</div>
      </div>
      <div class="sign-box">
        <div class="sign-line">অনুমোদনকারীর স্বাক্ষর</div>
      </div>
    </div>
  </div>
</template>

<script>
  const container = document.getElementById('voucher-container');
  const template = document.getElementById('voucher-template');
  container.style.display = 'flex';
  container.style.flexDirection = 'column';
  container.style.justifyContent = 'space-between';
  container.style.height = '100%';

  // প্রতি পেজে ২টি ভাউচার
  for (let i = 0; i < 2; i++) {
    const clone = template.content.cloneNode(true);
    container.appendChild(clone);
  }

  function clearAll() {
    document.querySelectorAll('input[type="text"]').forEach(inp => inp.value = '');
    document.querySelectorAll('.kothay-value').forEach(div => div.textContent = '');
  }

  // ---- Auto total calculation ----
  const bnDigits = "০১২৩৪৫৬৭৮৯";
  function toEnglishDigits(str) {
    return str.replace(/[০-৯]/g, d => bnDigits.indexOf(d));
  }

  document.querySelectorAll('.voucher').forEach(voucher => {
    const amountInputs = voucher.querySelectorAll('.body-rows .amount-col input');
    const totalInput = voucher.querySelector('.total-row .amount-col input');
    const kothayValue = voucher.querySelector('.kothay-value');

    function recalcTotal() {
      let sum = 0;
      amountInputs.forEach(inp => {
        const val = parseFloat(toEnglishDigits(inp.value).replace(/[^0-9.]/g, ''));
        if (!isNaN(val)) sum += val;
      });
      totalInput.value = sum ? sum.toLocaleString('en-US') : '';
      kothayValue.textContent = sum ? numberToBengaliWords(Math.round(sum)) : '';
    }

    amountInputs.forEach(inp => inp.addEventListener('input', recalcTotal));
  });

  // ---- Number to Bengali words ----
  const bnOnes = ['', 'এক', 'দুই', 'তিন', 'চার', 'পাঁচ', 'ছয়', 'সাত', 'আট', 'নয়', 'দশ',
    'এগারো', 'বারো', 'তেরো', 'চৌদ্দ', 'পনেরো', 'ষোলো', 'সতেরো', 'আঠারো', 'উনিশ', 'বিশ',
    'একুশ', 'বাইশ', 'তেইশ', 'চব্বিশ', 'পঁচিশ', 'ছাব্বিশ', 'সাতাশ', 'আঠাশ', 'ঊনত্রিশ', 'ত্রিশ',
    'একত্রিশ', 'বত্রিশ', 'তেত্রিশ', 'চৌত্রিশ', 'পঁয়ত্রিশ', 'ছত্রিশ', 'সাঁইত্রিশ', 'আটত্রিশ', 'ঊনচল্লিশ', 'চল্লিশ',
    'একচল্লিশ', 'বিয়াল্লিশ', 'তেতাল্লিশ', 'চুয়াল্লিশ', 'পঁয়তাল্লিশ', 'ছেচল্লিশ', 'সাতচল্লিশ', 'আটচল্লিশ', 'ঊনপঞ্চাশ', 'পঞ্চাশ',
    'একান্ন', 'বাহান্ন', 'তিপ্পান্ন', 'চুয়ান্ন', 'পঞ্চান্ন', 'ছাপ্পান্ন', 'সাতান্ন', 'আটান্ন', 'ঊনষাট', 'ষাট',
    'একষট্টি', 'বাষট্টি', 'তেষট্টি', 'চৌষট্টি', 'পঁয়ষট্টি', 'ছেষট্টি', 'সাতষট্টি', 'আটষট্টি', 'ঊনসত্তর', 'সত্তর',
    'একাত্তর', 'বাহাত্তর', 'তিয়াত্তর', 'চুয়াত্তর', 'পঁচাত্তর', 'ছিয়াত্তর', 'সাতাত্তর', 'আটাত্তর', 'ঊনআশি', 'আশি',
    'একাশি', 'বিরাশি', 'তিরাশি', 'চুরাশি', 'পঁচাশি', 'ছিয়াশি', 'সাতাশি', 'আটাশি', 'ঊননব্বই', 'নব্বই',
    'একানব্বই', 'বিরানব্বই', 'তিরানব্বই', 'চুরানব্বই', 'পঁচানব্বই', 'ছিয়ানব্বই', 'সাতানব্বই', 'আটানব্বই', 'নিরানব্বই'];

  function twoDigitWords(n) {
    return bnOnes[n] || '';
  }

  function numberToBengaliWords(num) {
    if (num === 0) return 'শূন্য টাকা মাত্র';
    let n = num;
    const crore = Math.floor(n / 10000000); n %= 10000000;
    const lakh = Math.floor(n / 100000); n %= 100000;
    const thousand = Math.floor(n / 1000); n %= 1000;
    const hundred = Math.floor(n / 100); n %= 100;
    const rest = n;

    const parts = [];
    if (crore) parts.push(twoDigitWords(crore) + ' কোটি');
    if (lakh) parts.push(twoDigitWords(lakh) + ' লক্ষ');
    if (thousand) parts.push(twoDigitWords(thousand) + ' হাজার');
    if (hundred) parts.push(twoDigitWords(hundred) + 'শত');
    if (rest) parts.push(twoDigitWords(rest));

    return parts.join(' ') + ' টাকা মাত্র';
  }
</script>

</body>
</html>
